[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  port = 3000

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/chatbot/*"
  to = "/api/chatbot/:splat"
  status = 200
  force = true

[functions."generate-insights-cron"]
  schedule = "0 9 * * *"

[functions."send-weekly-reports-cron"]
  schedule = "0 12 * * MON"

[functions."cleanup-old-events-cron"]
  schedule = "0 6 * * *"
